<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="color-scheme" content="light"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Swaralay Music Academy, Nashik</title>
<link href="https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Marathi&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--mr:#a31621;--mr2:#d64045;--bg:#f3e8d2;--card:#fdf1ee;--ink:#2b2224;--mut:#5f5557;--gd:#e8a317;--ln:#ecc5be;--sh:0 1px 1px rgba(163,22,33,.08),0 8px 16px -6px rgba(163,22,33,.15),0 28px 40px -20px rgba(163,22,33,.2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:none){body{background:radial-gradient(800px 600px at 0 0,#d6404544,transparent 62%),radial-gradient(800px 600px at 100% 100%,#e8a31733,transparent 62%),var(--bg)}:root:not([data-theme=light]){--bg:#241a12;--card:#35271c;--ink:#f3ecea;--mut:#b3a7a9;--ln:#3d3236}}
.nodark body{background:radial-gradient(800px 600px at 0 0,#d6404544,transparent 62%),radial-gradient(800px 600px at 100% 100%,#e8a31733,transparent 62%),var(--bg)}.nodark{--bg:#241a12;--card:#35271c;--ink:#f3ecea;--mut:#b3a7a9;--ln:#3d3236}
*{box-sizing:border-box}html{height:100%;scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.6 Hind,system-ui,sans-serif}
h1,h2,h3{font-family:'Tiro Devanagari Marathi',Georgia,serif;line-height:1.15;margin:0 0 .5em}
a{color:inherit}button,input,select{font:inherit}
:focus-visible{outline:3px solid var(--gd);outline-offset:2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:18px;padding:12px 5%;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.logo{display:flex;align-items:center;gap:10px;font-family:'Tiro Devanagari Marathi',Georgia,serif;font-weight:700;color:var(--mr);text-decoration:none;font-size:1.2rem;margin-right:auto}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--mr2),var(--mr));box-shadow:var(--sh);display:grid;place-items:center;color:#fff;font-style:normal;border:2px dashed #ffffff88}
.links{display:flex;gap:18px;align-items:center}.links a{text-decoration:none;color:var(--mut);font-weight:500}.links a:hover,.links a.cur:not(.btn){color:var(--mr)}.links a.cur:not(.btn){border-bottom:2px solid var(--gd)}#pv>section{animation:pg .4s ease}@keyframes pg{from{opacity:0;transform:translateY(12px)}}
.btn{display:inline-block;border:0;cursor:pointer;padding:12px 22px;border-radius:14px;font-weight:600;text-decoration:none;background:linear-gradient(160deg,var(--mr2),var(--mr));color:#fff;box-shadow:0 5px 0 #6e0d16,var(--sh);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(5px);box-shadow:0 0 0 #6e0d16,0 4px 8px rgba(0,0,0,.2)}
.btn.g{background:var(--card);color:var(--mr);box-shadow:0 5px 0 var(--ln),var(--sh)}
.btn.s{padding:7px 13px;font-size:.88rem;border-radius:10px}
#burger{display:none;background:none;border:1px solid var(--ln);border-radius:10px;padding:8px 12px;color:var(--ink)}
section{padding:72px 5%;max-width:1180px;margin:auto}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:78vh}
.hero h1{font-size:clamp(2.4rem,6vw,4.4rem);color:var(--mr)}
.sub{color:var(--mut);max-width:52ch;font-size:1.1rem}.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.stage{position:relative;aspect-ratio:1;max-width:460px;margin:auto;width:100%;perspective:900px}
.disc{background:repeating-conic-gradient(#a31621 0 9deg,#d64045 9deg 18deg,#e8a317 18deg 27deg)!important}.disc:before{content:"";position:absolute;inset:12%;border-radius:50%;border:4px dotted #ffe0a0}.disc:after{background:#fffdf5;border:4px double var(--gd)!important}
.mic{left:39%!important;top:5%!important;width:22%!important}.mic svg{width:100%;display:block}
.card{border:1px solid var(--gd);box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px #e8a31766,var(--sh)}.card:hover{box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px #e8a317,0 18px 28px -8px #a3162144,0 44px 60px -26px #a3162166}
nav{border-bottom:4px double var(--gd)}.links a{display:flex;flex-direction:column;align-items:center;line-height:1.15;font-family:'Tiro Devanagari Marathi',Georgia,serif}.links a.btn{display:inline-block}.links small{font-size:.66rem;color:var(--mut);font-family:Hind,sans-serif}
#courses>h2,#gallery>h2,#news>h2,#contact>h2{text-align:center}h2:after{content:"\2756";display:block;color:var(--gd);font-size:.9rem;margin-top:4px}#courses>h2:after,#gallery>h2:after,#news>h2:after,#contact>h2:after{text-align:center}
.btn{border:1px solid #e8a317}.glass{font-family:'Tiro Devanagari Marathi',serif}
.links a.btn,.links a.btn:hover{color:#fff;font-weight:600;white-space:nowrap;padding:10px 20px;text-shadow:0 1px 1px #0004}.scene{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .2s ease-out}
.ring{position:absolute;inset:-4%;border-radius:50%;border:2px solid var(--gd);opacity:.55;transform:translateZ(-70px)}.ring.r2{inset:-12%;opacity:.3;transform:translateZ(-140px)}
.mic{position:absolute;left:38%;top:12%;width:24%;transform:translateZ(90px);filter:drop-shadow(0 22px 18px #0006)}
.mic i{display:block;width:70%;margin:auto;aspect-ratio:1/1.35;border-radius:40px;background:radial-gradient(circle at 30% 25%,#fff,#bbb 55%,#666)}
.mic b{display:block;width:12%;height:90px;margin:-6px auto 0;background:linear-gradient(90deg,#333,#aaa,#333);border-radius:6px}
.keys{position:absolute;left:12%;right:12%;bottom:15%;height:17%;display:flex;gap:3px;transform:translateZ(120px) rotateX(38deg)}
.keys u{flex:1;background:#fffdf5;border-radius:0 0 8px 8px;box-shadow:0 9px 0 #e3b9b2,0 18px 22px #0004}
.glass{transform:translateZ(170px)}.card{transform-style:preserve-3d;transition:transform .18s ease-out,box-shadow .2s}.card:hover{box-shadow:0 2px 2px #a3162114,0 18px 28px -8px #a3162133,0 44px 60px -26px #a3162155}
.ic{transform:translateZ(36px)}.card h3{transform:translateZ(20px)}
.disc{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle at 30% 25%,var(--mr2),var(--mr) 60%,#4a0810);box-shadow:var(--sh),inset 0 -20px 40px #0004;transform:rotateX(18deg) rotateY(-14deg);animation:tilt 9s ease-in-out infinite alternate}
.disc:after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--bg);box-shadow:inset 0 4px 10px #0005;border:3px solid var(--gd)}
@keyframes tilt{to{transform:rotateX(8deg) rotateY(14deg)}}
.glass{position:absolute;padding:14px 18px;border-radius:18px;background:#fdf1eecc;color:var(--mr);backdrop-filter:blur(10px);border:1px solid #ecc5be;box-shadow:var(--sh);font-family:'Tiro Devanagari Marathi',Georgia,serif;font-size:1.05rem}
.n{position:absolute;color:var(--gd);font-size:2rem;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(8deg)}}
.wave{display:flex;gap:4px;align-items:center;height:40px}.wave b{width:5px;background:var(--gd);border-radius:3px;animation:w 1.2s ease-in-out infinite}
@keyframes w{50%{height:100%}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:24px;box-shadow:var(--sh);transition:transform .25s}
.card:hover{transform:translateY(-6px) rotateX(3deg)}
.card h3{font-size:1.25rem}.tag{display:inline-block;font-size:.8rem;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--mr) 10%,transparent);color:var(--mr);margin:0 6px 6px 0}
.ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:linear-gradient(145deg,#fdf1ee,#f5c9c2);box-shadow:var(--sh);margin-bottom:12px}
.tl{border-left:3px solid var(--gd);padding-left:18px;margin-top:16px}.tl p{margin:0 0 10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
.gal{columns:3 200px;gap:14px}.gal img{width:100%;display:block;break-inside:avoid;margin-bottom:14px;border-radius:18px;box-shadow:var(--sh);cursor:pointer;object-fit:cover;transition:transform .2s}.gal img:hover{transform:scale(1.02)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.chip{border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--ink)}.chip.on{background:var(--mr);color:#fff}
#lb{position:fixed;inset:0;background:#000d;display:none;place-items:center;z-index:50;color:#fff;font-family:'Tiro Devanagari Marathi',Georgia,serif;font-size:1.6rem}#lb.on{display:grid}
label{display:block;font-weight:600;margin:14px 0 4px}
input,select{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink)}
.err{color:#b3261e;font-size:.85rem;min-height:1em}
.ok{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#e6f4ea;color:#14532d;animation:pop .4s}.ok.on{display:block}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--mr),#4a0810);color:#fff;padding:20px 14px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.side a{display:block;padding:10px 14px;border-radius:12px;color:#ffffffcc;text-decoration:none;cursor:pointer}.side a.on,.side a:hover{background:#ffffff22;color:#fff}
.main{padding:28px 4%;overflow-x:hidden}
.stat{font-family:'Tiro Devanagari Marathi',Georgia,serif;font-size:2.1rem;color:var(--mr)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--ln);white-space:nowrap}
.pill{padding:2px 10px;border-radius:99px;font-size:.8rem;background:#fdecc8;color:#7a5200}.pill.v{background:#d9f1e0;color:#14532d}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:.85rem;background:var(--bg)}
.P{background:#d9f1e0!important}.A{background:#f8d7da!important}.H{background:#fdecc8!important}
.bars{display:flex;align-items:end;gap:10px;height:120px}.bars i{flex:1;background:linear-gradient(var(--mr2),var(--mr));border-radius:8px 8px 0 0;min-height:4px;transition:height .8s}
.slot{padding:8px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);cursor:pointer;color:var(--ink)}.slot[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.hide{display:none!important}.bn{display:none}
@media(max-width:860px){.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--bg);padding:18px;border-bottom:1px solid var(--ln)}.links.on{display:flex}#burger{display:block}
.hero,.split{grid-template-columns:1fr}section{padding:48px 5%}.app{grid-template-columns:1fr}.side{display:none}.main{padding-bottom:84px}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);padding:8px 4% calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:30}.bn a{font-size:.8rem;text-align:center;cursor:pointer}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="pub">
<nav><a class="logo" href="#home"><i title="Logo placeholder">♪</i>Swaralay</a><button id="burger" aria-label="Menu">Menu</button>
<div class="links" id="links"><a href="#home">Home</a><a href="#about">About Us</a><a href="#courses">Courses</a><a href="#gallery">Gallery</a><a href="#news">Announcements</a><a href="#contact">Contact</a><a href="#portal" data-v="portal">Student Portal</a><a class="btn s" href="#join" data-v="join">Join Swaralay</a></div></nav>
<main id="pv"></main>
<footer style="text-align:center;padding:30px;color:var(--mut)">© Swaralay Music Academy, Nashik · <a href="#admin" data-v="admin">Admin</a></footer></div>
<div id="lb" onclick="this.classList.remove('on')"></div>
<script>
const $=s=>document.querySelector(s),S={fee:750,upi:'swaralay@sbi',taken:['10:00','12:00']};
try{const f=localStorage.getItem('fee');if(f)S.fee=+f}catch(e){}
const courses=[['🎤','Light Vocal Music','Bhavgeet, ghazal and film-style singing with clear technique.','Weekly sessions, online or offline','Beginners to hobbyists'],['🎶','Semi-Classical Music','Thumri, dadra, natyasangeet and bhajan built on raag basics.','Structured modules with riyaz plans','Learners with some singing practice'],['🧑‍🏫','Individual Vocal Training','One-to-one 1-hour sessions shaped around your voice.','1 hour, booked slot','Anyone who wants personal attention'],['👥','Group Vocal Training','Learn and perform alongside a batch of peers.','Fixed batch timings','Students who enjoy group learning']];
const news=[['Holiday Notice','12 Oct 2026','Classes remain closed for Dussehra. Practice the assigned bandish at home.'],['New Batch Announcement','20 Oct 2026','A new evening Semi-Classical batch opens next month.'],['Upcoming Performance','2 Nov 2026','Annual student recital at Nashik. Rehearsals begin this week.']];
const gcat=['Performances','Student Recitals','Academy Events','Classes','Achievements'],gcol=['#a31621','#e8a317','#d64045','#c0392b','#7a1019'];
const cols=[['#a31621','#e8a317'],['#d64045','#a31621'],['#e8a317','#e0662b'],['#7a1019','#d64045'],['#c0392b','#e8a317']];
const mot=['<rect x="350" y="140" width="100" height="170" rx="50" fill="#fff"/><path d="M320 250a80 80 0 0 0 160 0M400 330v80M340 410h120" stroke="#fff" stroke-width="16" fill="none" stroke-linecap="round"/>','<text x="400" y="420" font-size="320" text-anchor="middle" fill="#fff">&#9835;</text>','<polygon points="200,0 120,470 280,470" fill="#fff4"/><polygon points="400,0 320,470 480,470" fill="#fff4"/><polygon points="600,0 520,470 680,470" fill="#fff4"/><rect x="100" y="440" width="600" height="30" rx="8" fill="#fff"/>',Array.from({length:8},(_,k)=>`<rect x="${160+k*60}" y="170" width="56" height="260" rx="6" fill="#fff"/>`).join('')+[0,1,3,4,5].map(k=>`<rect x="${196+k*60}" y="170" width="36" height="150" rx="5" fill="#2a2526"/>`).join(''),'<polygon points="400,130 445,250 575,255 472,335 510,460 400,388 290,460 328,335 225,255 355,250" fill="#fff"/>'];
const G=Array.from({length:12},(_,i)=>{const k=i%5,[c1,c2]=cols[k],sv=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><circle cx="${120+i*40}" cy="90" r="160" fill="#fff" fill-opacity=".12"/><circle cx="700" cy="520" r="200" fill="#fff" fill-opacity=".1"/>${mot[k]}</svg>`;return{c:gcat[k],src:'data:image/svg+xml,'+encodeURIComponent(sv),h:230+(i*53%150)}});
function home(){return `<section class="hero" id="home"><div><h3 style="color:var(--gd)">Welcome to Swaralay Music Academy</h3><h1>Where Music Becomes a Journey</h1><p class="sub">Learn Light Vocal Music and Semi-Classical Music with structured guidance, practice and personal attention.</p><p class="sub" style="font-family:'Tiro Devanagari Marathi',Georgia,serif;color:var(--mr)">सुगम संगीत व उपशास्त्रीय संगीतावर आधारित</p><div class="row"><a class="btn" href="#join" data-v="join">Join Swaralay</a><a class="btn g" href="#about">Explore Academy</a></div></div>
<div class="stage"><div class="scene" id="sc"><div class="ring"></div><div class="ring r2"></div><div class="disc"></div><div class="mic"><svg viewBox="0 0 100 270"><defs><radialGradient id="tg" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffc04d"/><stop offset="1" stop-color="#e8821e"/></radialGradient></defs><rect x="44" y="8" width="12" height="170" rx="5" fill="#7a1019"/><g stroke="#ffe0a0" stroke-width="3" stroke-linecap="round"><path d="M38 24h12M62 38h-12M38 52h12M62 66h-12"/></g><ellipse cx="50" cy="210" rx="44" ry="56" fill="url(#tg)"/><circle cx="50" cy="205" r="11" fill="#3a0a10"/><rect x="34" y="236" width="32" height="5" rx="2" fill="#ffe0a0"/><g stroke="#ffe0a0" stroke-opacity=".9"><path d="M47 14V238M50 14V238M53 14V238"/></g></svg></div><div class="keys">${'<u></u>'.repeat(8)}</div><span class="n" style="top:4%;left:10%">♪</span><span class="n" style="top:18%;right:4%;animation-delay:-2s">♫</span><span class="n" style="bottom:12%;left:2%;animation-delay:-4s">♩</span><div class="glass" style="top:36%;left:-2%">🎙 Riyaz</div><div class="glass" style="top:46%;right:-3%">🎹 Swar</div></div><div class="wave" style="position:absolute;bottom:2%;left:30%">${'<b></b>'.repeat(9).replace(/<b>/g,()=>`<b style="animation-delay:-${Math.random().toFixed(2)}s">`)}</div></div></section>
<section id="about"><div class="split"><div><h2>About Swaralay</h2><p>Swaralay in Nashik focuses on Light Vocal and Semi-Classical music. Lessons are structured, singing is practical, and every student gets individual guidance to build performance confidence.</p><div class="tl"><p><b>Foundation:</b> voice, swar and rhythm basics</p><p><b>Repertoire:</b> light and semi-classical compositions</p><p><b>Stage:</b> recitals and academy events</p></div></div><div class="card" style="text-align:center;font-size:4rem">🎼<br><small style="font-size:1rem;color:var(--mut)">Placeholder: replace with academy photo</small></div></div></section>
<section id="courses"><h2>Courses</h2><div class="grid">${courses.map(c=>`<div class="card"><div class="ic">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p><span class="tag">${c[3]}</span><span class="tag">${c[4]}</span><br><a class="btn s" href="#join" data-v="join" style="margin-top:8px">Enquire</a></div>`).join('')}</div></section>
<section id="gallery"><h2>Gallery</h2><div class="chips" id="chips"></div><p><label class="btn s g" for="up">+ Add photos</label><input id="up" type="file" accept="image/*" multiple hidden> <small style="color:var(--mut)">Photos go into the selected category for this session. Permanent storage comes with the database.</small></p><div class="gal" id="gal"></div></section>
<section id="news"><h2>Announcements</h2><div class="grid">${news.map(n=>`<div class="card"><small style="color:var(--gd)">${n[1]}</small><h3>${n[0]}</h3><p>${n[2]}</p></div>`).join('')}</div></section>
<section id="contact"><h2>Contact</h2><div class="card"><h3>Swaralay Music Academy</h3><p>Nashik, Maharashtra (address, phone, WhatsApp and email editable by Admin in Settings)</p><div class="row"><a class="btn" href="tel:+910000000000">Call Now</a><a class="btn g" href="https://wa.me/910000000000">WhatsApp</a><a class="btn g" href="https://www.google.com/maps/search/?api=1&query=Nashik">Get Directions</a></div></div></section>`}
function join(){return `<section><div class="split"><div><h2>Student Registration</h2><p class="sub">One-Time Registration Fee: <b style="color:var(--mr)">₹${S.fee}</b></p><p>Pay by UPI, upload your screenshot, and we will verify it before activating your access.</p></div>
<form class="card" id="rf" novalidate><label>Full name</label><input id="fn"><div class="err"></div><label>WhatsApp mobile number</label><input id="ph" inputmode="numeric" placeholder="10-digit number"><div class="err"></div><label>Date of birth</label><input id="dob" type="date"><div class="err"></div><label>Class format</label><select><option>Online</option><option>Offline</option></select><label>Track</label><select><option>Individual 1-Hour</option><option>Group</option></select>
<label>UPI ID</label><div class="row" style="margin:0"><b style="align-self:center">${S.upi}</b><button type="button" class="btn s g" id="cp">Copy UPI ID</button></div>
<label>Payment screenshot</label><input id="ss" type="file" accept="image/png,image/jpeg"><div class="err"></div><div style="height:6px;background:var(--ln);border-radius:9px;margin-top:8px"><div id="pg" style="height:100%;width:0;background:var(--gd);border-radius:9px;transition:width 1s"></div></div><button class="btn" style="margin-top:16px;width:100%">Submit registration</button>
<div class="ok" id="ok"><b>Payment submitted successfully.</b><br>Status: Waiting for Admin Verification</div></form></div></section>`}
function portal(){return `<section><h2>Student Portal</h2><div class="card" id="lg" style="max-width:420px"><label>Mobile number</label><input value="9876543210"><label>Password</label><input type="password" value="demo"><button class="btn" style="margin-top:16px;width:100%" id="li">Log in (demo)</button></div><div id="sd" class="hide"><h3>Welcome, Aarav Sharma</h3><div class="grid"><div class="card"><b>Profile</b><p>DOB: 12 Oct 2012<br>Track: Group · Batch B Evening<br>Format: Offline<br>Admitted: 19 Aug 2026<br>Next due: 19 Nov 2026 · ₹2,000</p></div><div class="card"><b>Attendance: 83%</b><div class="cal" style="margin-top:10px">${Array.from({length:28},(_,i)=>`<span class="${i%7==6?'H':i%9==4?'A':'P'}">${i+1}</span>`).join('')}</div><small>Green present · red absent · amber holiday</small></div><div class="card"><b>Book a 1-hour slot</b><p id="bm" style="color:#14532d;min-height:1.5em"></p><div class="row" id="sl" style="margin:0"></div></div></div></div></section>`}

<div class="main"><h2 id="at">Dashboard</h2><div id="ab"></div></div><div class="bn"><a data-a="Dashboard">Home</a><a data-a="Students">Students</a><a data-a="Payments">Pay</a><a data-a="Settings">More</a></div></div>`}

Students:()=>tbl(['Name','Track','Batch','Monthly fee','Admission'],[['Aarav Sharma','Group','B','₹2,000','19 Aug 2026'],['Riya Joshi','Individual','-','₹3,000','02 Sep 2026']])+`<button class="btn s" style="margin-top:14px">Add student</button>`,
Payments:()=>`<div class="grid" id="pc">${[['Aarav Sharma','Monthly Tuition','₹2,000'],['Neha Patil','Registration','₹'+S.fee]].map(p=>`<div class="card"><b>${p[0]}</b><p>${p[1]} · ${p[2]}<br>Submitted today · screenshot.jpg</p><span class="pill">Pending</span><div class="row"><button class="btn s g">View Screenshot</button><button class="btn s vf">Verify Payment</button><button class="btn s g">Reject</button></div></div>`).join('')}</div>`,

Reports:()=>aviews.Batches(),Announcements:()=>tbl(['Title','Date','Actions'],news.map(n=>[n[0],n[1],'Edit · Delete'])),Gallery:()=>`<div class="card">Upload and manage photos by category. <button class="btn s">Upload image</button></div>`,
'Birthday Messages':()=>`<div class="card"><label><input type="checkbox" checked style="width:auto"> Birthday messages ON</label><p>Preview: "Dear Aarav, Swaralay Music Academy wishes you a very Happy Birthday! 🎂🎶"</p><button class="btn s">Send test message</button></div>`+tbl(['Student','Birthday','Days left','Status'],[['Aarav Sharma','12 Oct','4','Scheduled'],['Isha Kulkarni','18 Oct','10','Scheduled']]),

function showA(n){$('#at').textContent=n;$('#ab').innerHTML=aviews[n]();document.querySelectorAll('[data-a]').forEach(a=>a.classList.toggle('on',a.dataset.a==n));

const sf=$('#sf');if(sf)sf.onsubmit=e=>{e.preventDefault();S.fee=+$('#rfee').value||750;try{localStorage.setItem('fee',S.fee)}catch(x){}$('#sok').classList.add('on')}}
function render(){const h=location.hash.slice(1)||'home',v={join,portal,admin}[h];$('#pub').classList.toggle('hide',h=='admin');let ad=$('#adm');if(ad)ad.remove();

$('#up').onchange=e=>{[...e.target.files].filter(f=>f.type.startsWith('image/')).forEach(f=>{const r=new FileReader();r.onload=()=>{G.unshift({c:c=='All'?gcat[0]:c,src:r.result});d()};r.readAsDataURL(f)})}}
if(h=='join'){$('#cp').onclick=e=>{try{navigator.clipboard.writeText(S.upi)}catch(x){}e.target.textContent='Copied'};$('#rf').onsubmit=e=>{e.preventDefault();const E=document.querySelectorAll('.err');let ok=1;const t=(i,c,m)=>{E[i].textContent=c?'':m;if(!c)ok=0};t(0,$('#fn').value.trim().length>2,'Enter your full name.');t(1,/^[6-9]\d{9}$/.test($('#ph').value),'Enter a valid 10-digit Indian mobile number.');t(2,$('#dob').value&&new Date($('#dob').value)<new Date(),'Choose a valid past date.');const f=$('#ss').files[0];t(3,f&&/image\/(png|jpeg)/.test(f.type)&&f.size<5e6,'Upload a PNG or JPG under 5 MB.');if(ok){$('#pg').style.width='100%';setTimeout(()=>$('#ok').classList.add('on'),900)}}}
if(h=='portal'){$('#li').onclick=()=>{$('#lg').classList.add('hide');$('#sd').classList.remove('hide');const draw=()=>{$('#sl').innerHTML=['09:00','10:00','11:00','12:00','16:00'].map(s=>`<button class="slot" ${S.taken.includes(s)?'disabled':''}>${s}</button>`).join('');document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{S.taken.push(b.textContent);$('#bm').textContent='Slot successfully booked.';draw()})};draw()}}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&$('#adm'))showA(a.dataset.a)});
const T=e=>e.target.closest?e.target:document.body;
document.addEventListener('mousemove',e=>{if(matchMedia('(pointer:coarse)').matches)return;const c=T(e).closest('.card,.gal img');if(c&&!c.matches('.tw,form,#lg')){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(800px) rotateY(${x*14}deg) rotateX(${-y*14}deg) translateZ(8px)`}const st=T(e).closest('.stage'),sc=$('#sc');if(st&&sc){const r=st.getBoundingClientRect();sc.style.transform=`rotateY(${((e.clientX-r.left)/r.width-.5)*34}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*34}deg)`}});
document.addEventListener('mouseout',e=>{const c=T(e).closest('.card,.gal img');if(c&&!c.contains(e.relatedTarget))c.style.transform='';const st=T(e).closest('.stage'),sc=$('#sc');if(st&&sc&&!st.contains(e.relatedTarget))sc.style.transform=''});
$('#burger').onclick=()=>$('#links').classList.toggle('on');addEventListener('hashchange',render);render();
