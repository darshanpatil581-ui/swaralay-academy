@keyframes pop{from{transform:scale(.9);opacity:0}}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--mr),#4a0810);color:#fff;padding:20px 14px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.side a{display:block;padding:10px 14px;border-radius:12px;color:#ffffffcc;text-decoration:none;cursor:pointer}.side a.on,.side a:hover{background:#ffffff22;color:#fff}
.main{padding:28px 4%;overflow-x:hidden}
.stat{font-family:'Tiro Devanagari Marathi',Georgia,serif;font-size:2.1rem;color:var(--mr)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--ln);white-space:nowrap}
.pill{padding:2px 10px;border-radius:99px;font-size:.8rem;background:#fdecc8;color:#7a5200}.pill.v{background:#d9f1e0;color:#14532d}
.bcg{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media(max-width:700px){.bcg{grid-template-columns:1fr}}.cal .bch{background:none;aspect-ratio:auto;font-weight:700;font-size:.75rem;color:var(--mut,#7a6a5a)}.cal .bc-on{background:#7a1f2b;color:#fff;font-weight:700}.bci{padding:9px 0;border-bottom:1px solid rgba(0,0,0,.08)}.bci small{display:block;opacity:.75}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:.85rem;background:var(--bg)}
.P{background:#d9f1e0!important}.A{background:#f8d7da!important}.H{background:#fdecc8!important}
.bars{display:flex;align-items:end;gap:10px;height:120px}.bars i{flex:1;background:linear-gradient(var(--mr2),var(--mr));border-radius:8px 8px 0 0;min-height:4px;transition:height .8s}
.slot{padding:8px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--card);cursor:pointer;color:var(--ink)}.slot[disabled]{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.hide{display:none!important}.bn{display:none}
@media(max-width:860px){.header-logo{max-width:165px;height:42px}.links{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:#fff;padding:18px;border-bottom:1px solid var(--ln)}.links.on{display:flex}#burger{display:block}
.hero,.split{grid-template-columns:1fr}section{padding:48px 5%}.app{grid-template-columns:1fr}.side{display:none}.main{padding-bottom:84px}
.bn{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);padding:8px 4% calc(8px + env(safe-area-inset-bottom,0px));justify-content:space-around;z-index:30}.bn a{font-size:.8rem;text-align:center;cursor:pointer}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.tick .tk-t{animation:tkmove var(--tkd,40s) linear infinite!important}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2b2224;color:#fff;padding:12px 20px;border-radius:14px;box-shadow:var(--sh);z-index:80;animation:pop .3s;max-width:90vw}
.pill.r{background:#f8d7da;color:#8a1717}.amob{display:none;margin-bottom:14px}.side a{cursor:pointer}.bn a{cursor:pointer}
.thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px}.note{padding:12px 14px;border-radius:12px;background:#fdecc8;color:#7a5200;font-size:.92rem;margin:12px 0}
textarea{font:inherit}@media(max-width:860px){.amob{display:block}}
.al-body{min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(800px 500px at 0 0,#d6404518,transparent 65%),radial-gradient(700px 500px at 100% 100%,#e8a31718,transparent 60%),#F7F7F7;font:16px/1.55 Hind,system-ui,sans-serif;color:#2b2224}
.al-wrap{width:min(100%,1000px);display:grid;grid-template-columns:1fr 1fr;background:#fff;border:1px solid #ead6d3;border-radius:26px;overflow:hidden;box-shadow:0 20px 55px #6e0d161c}
.al-brand{background:linear-gradient(145deg,#d64045,#a31621 70%,#4a0810);color:#fff;padding:44px 36px;display:flex;flex-direction:column;justify-content:space-between;min-height:530px}
.al-brand img{width:58px;height:58px;object-fit:contain;background:#fff;border-radius:14px;padding:4px}
.al-brand h1{font:700 clamp(2rem,4vw,3rem)/1.12 'Tiro Devanagari Marathi',Georgia,serif;margin:25px 0 14px;color:#fff}
.al-brand p{color:#fffde0e8;margin:0}.al-badge{display:inline-block;border:1px solid #ffffff66;border-radius:99px;padding:6px 12px;font-size:.85rem}
.al-form{padding:44px 36px;display:flex;flex-direction:column;justify-content:center}
.al-form h2{font:700 1.9rem 'Tiro Devanagari Marathi',Georgia,serif;margin:0 0 6px;color:#a31621}.al-form h2:after{content:none}
.al-muted{color:#66595a;margin-top:0}.al-notice{padding:12px 14px;border-radius:12px;background:#fde8e7;color:#8a1717;font-size:.9rem;margin:16px 0;overflow-wrap:anywhere}
.al-form label{display:block;font-weight:600;margin:16px 0 6px}
.al-form input{width:100%;padding:13px 14px;border:1px solid #ead6d3;border-radius:12px;background:#fff;color:#2b2224;font:inherit}
.al-form input:focus{outline:3px solid #e8a31755;border-color:#e8a317}
.al-form button{width:100%;margin-top:22px;border:0;border-radius:12px;padding:13px 16px;background:linear-gradient(160deg,#d64045,#a31621);color:#fff;font:600 1rem Hind,system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 0 #6e0d16}
.al-form button:disabled{opacity:.65;cursor:wait}.al-back{display:inline-block;margin-top:22px;color:#a31621;font-weight:600;text-decoration:none}.al-small{font-size:.9rem;color:#66595a}
@media(max-width:720px){.al-wrap{grid-template-columns:1fr}.al-brand{min-height:auto;padding:28px}.al-brand h1{margin:18px 0 8px}.al-form{padding:30px 24px}}

<script>

const SB_URL='https://obzkxkuuwilnsdwxaddh.supabase.co',SB_KEY='sb_publishable_rD_52j8wq074fDC2IvuYKw_wwbsWH9V';

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const dt=d=>{if(!d)return '—';const x=(typeof d=='string'&&d.length==10)?new Date(d+'T00:00:00'):new Date(d);return x.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})};

// ===== Member state, navigation, WhatsApp, ticker, visitor counter =====

function cycleStart(adm){if(!adm)return null;const a=new Date(adm+'T00:00:00'),t=today0();let r=null;for(let m=1;m<600;m++){const x=addM(a,m);if(x<=t)r=x;else break}return r}
// Amount still due for the current billing cycle (0 if paid, not yet due, or fee not set)
function dueAmt(s,pays){if(s.status!=='active'||!s.admission_date||!(+s.monthly_fee>0))return 0;const c=cycleStart(s.admission_date);if(!c)return 0;const from=new Date(c.getTime()-7*864e5);const paid=pays.some(p=>p.student_id===s.id&&p.type==='Monthly Tuition'&&p.status==='verified'&&new Date(p.submitted_at)>=from);return paid?0:+s.monthly_fee}
const ANT='Dear {student_name}, congratulations! Today you complete {years} at Swaralay Music Academy. Thank you for being a part of our musical family. Keep up your riyaz!';
const yrs=n=>n+(n==1?' year':' years');
function anniv(st){const t=today0();return st.filter(s=>s.status==='active'&&s.admission_date).map(s=>{const d=new Date(s.admission_date+'T00:00:00');let y=t.getFullYear(),n=new Date(y,d.getMonth(),d.getDate());if(n<t)n=new Date(++y,d.getMonth(),d.getDate());if(y-d.getFullYear()<1)n=new Date(d.getFullYear()+1,d.getMonth(),d.getDate());return{s,n,years:n.getFullYear()-d.getFullYear(),left:Math.round((n-t)/864e5)}}).sort((a,b)=>a.left-b.left)}
const annMsg=(tpl,x)=>(tpl||ANT).replace(/\{student_name\}/g,x.s.full_name).replace(/\{years\}/g,yrs(x.years));
const annWa=(tpl,x)=>'https://wa.me/91'+String(x.s.whatsapp||'').replace(/\D/g,'')+'?text='+encodeURIComponent(annMsg(tpl,x));

// ===== Swar keys, scales, taal and volume (all inside the home figure) =====
// 8 white keys = Sa Re Ga Ma Pa Dha Ni Sa(upper), 4 black keys = the other swars of the chosen scale. Lowercase = komal.
const SWNM=['Sa','re','Re','ga','Ga','Ma','Ma','Pa','dha','Dha','ni','Ni','Sa'];
const SWRT=['C','C#','D','D#','E','F','F#','G','G#','A','Bb','B'];
const SWMAJ={w:[0,2,4,5,7,9,11,12],b:[[1,0],[3,1],[8,4],[10,5]]};   // black: [semitone, boundary after white #]
const SWMIN={w:[0,2,3,5,7,8,10,12],b:[[1,0],[4,2],[9,5],[11,6]]};
const SW={root:0,minor:false,vol:70,mute:false};
const swL=()=>SW.minor?SWMIN:SWMAJ;
const swSemi=i=>{const L=swL();return i<8?L.w[i]:L.b[i-8][0]};
const swHz=s=>261.626*Math.pow(2,((SW.root>=7?SW.root-12:SW.root)+s)/12);
const swGain=()=>SW.mute?0:Math.pow(SW.vol/100,2)*.9;
function swKeys(){
 const P=(r,a)=>[(50+r*Math.cos(a*Math.PI/180)).toFixed(2),(50+r*Math.sin(a*Math.PI/180)).toFixed(2)],R1=26,R2=46,A0=168,SP=156,W=SP/8,rb=R1+(R2-R1)*.56,L=swL();
 const sec=(r1,r2,a1,a2)=>{const[o1,o2,i2,i1]=[P(r2,a1),P(r2,a2),P(r1,a2),P(r1,a1)];return `M${o1}A${r2} ${r2} 0 0 0 ${o2}L${i2}A${r1} ${r1} 0 0 1 ${i1}Z`};
 let wh='',bl='';
 L.w.forEach((s,j)=>{const a1=A0-j*W-.4,a2=A0-(j+1)*W+.4,am=(a1+a2)/2,lp=P(R2-4.6,am);
  wh+=`<g class="swk w" data-i="${j}" role="button" aria-label="${SWNM[s]}"><path class="kb" d="${sec(R1,R2,a1,a2)}"/><text x="${lp[0]}" y="${(+lp[1]+1.1).toFixed(2)}">${SWNM[s]}</text>${j==7?`<circle cx="${lp[0]}" cy="${(+lp[1]-2.2).toFixed(2)}" r=".55"/>`:''}</g>`});
 L.b.forEach((b,q)=>{const ab=A0-(b[1]+1)*W,a1=ab+6,a2=ab-6,lp=P(rb-3.4,ab);
  bl+=`<g class="swk b" data-i="${8+q}" role="button" aria-label="${SWNM[b[0]]}"><path class="kb" d="${sec(R1,rb,a1,a2)}"/><text x="${lp[0]}" y="${(+lp[1]+.8).toFixed(2)}">${SWNM[b[0]]}</text></g>`});
 const arc=(r,a1,a2)=>`M${P(r,a1)}A${r} ${r} 0 0 0 ${P(r,a2)}`;
 return `<svg class="swa" id="swa" viewBox="0 0 100 100" aria-label="Swar keys: tap to play"><defs><linearGradient id="swW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#f3dcc4"/></linearGradient><linearGradient id="swB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b1520"/><stop offset="1" stop-color="#1c050b"/></linearGradient></defs><path class="plate glow" d="${arc(R1-1.6,A0+4,A0-SP-4)}"/><path class="plate glow" d="${arc(R2+1.6,A0+4,A0-SP-4)}"/>${wh}${bl}<rect class="swbd" x="32" y="64.2" width="36" height="8.4" rx="4.2"/><text class="swbt" x="50" y="69.9">Sa = ${SWRT[SW.root]} ${SW.minor?'Minor':'Major'}</text></svg>`}

// ----- taal (rhythm) -----
const TAAL={
 Rupak:{n:7,v:[3,2,2],k:{0:'k',3:'t',5:'t'},b:['Ti','Ti','Na','Dhi','Na','Dhi','Na']},
 Bhajani:{n:8,v:[4,4],k:{0:'x',4:'k'},b:[['Dhin'],['Na','Dhin'],[null,'Dhin'],['Na'],['Tin'],['Na','Tin'],[null,'Tin'],['Na']]},
 Kerva:{n:8,v:[4,4],k:{0:'x',4:'k'},b:['Dha','Ge','Na','Ti','Na','Ka','Dhi','Na']},
 Dadra:{n:6,v:[3,3],k:{0:'x',3:'k'},b:['Dha','Dhi','Na','Dha','Ti','Na']},
 Teental:{n:16,v:[4,4,4,4],k:{0:'x',4:'t',8:'k',12:'t'},b:['Dha','Dhin','Dhin','Dha','Dha','Dhin','Dhin','Dha','Dha','Tin','Tin','Ta','Ta','Dhin','Dhin','Dha']}};
const TL={name:'Teental',bpm:90,click:false,run:false,beat:0,next:0,timer:null,q:[],raf:0,taps:[]};
function swDots(){const T=TAAL[TL.name];let h='',i=0;T.v.forEach(len=>{h+='<span class="swv">';for(let k=0;k<len;k++,i++){const kd=T.k[i]||'n';
  const num=kd==='t'?(T.k[0]==='x'||T.k[0]==='k'?1:0)+Object.keys(T.k).filter(x=>T.k[x]==='t'&&+x<=i).length:'';
  h+=`<i class="${kd}" data-b="${i}">${kd==='x'?'X':kd==='k'?'0':num}</i>`}h+='</span>'});return h}
let TNB=null;
const tNoise=a=>{if(!TNB){const n=Math.floor(a.sampleRate*.08),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;TNB=b}return TNB};
function tbolSynth(a,t,bol,kind,vol){
 const sa=swHz(0),khali=kind==='k',low=/^(Ge|Ke|Ka)$/.test(bol),bay=!khali&&/^(Dha|Dhin|Dhi|Ge|Ke|Ka)$/.test(bol),day=!low&&/^(Dha|Dhin|Dhi|Na|Ta|Tin|Ti|Tu)$/.test(bol);
 const ring={Dha:.26,Dhin:.34,Dhi:.2,Na:.11,Ta:.12,Tin:.42,Ti:.1,Tu:.1}[bol]||.1;
 const mk=(f1,f2,dur,pk)=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(f1,t);if(f2!==f1)o.frequency.exponentialRampToValueAtTime(f2,t+.12);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+.004);g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(SWM);o.start(t);o.stop(t+dur+.03)};
 if(bay){const f0=Math.max(92,sa*.5);mk(f0*1.7,f0,/^Ge$/.test(bol)?.28:/^K[ea]$/.test(bol)?.12:.4,(/^K[ea]$/.test(bol)?.5:.85)*vol)}
 if(day){mk(sa,sa,ring,.5*vol);mk(sa*2,sa*2,ring*.7,.22*vol);mk(sa*3,sa*3,ring*.5,.12*vol)}
 const ns=a.createBufferSource(),bp=a.createBiquadFilter(),ng=a.createGain();ns.buffer=tNoise(a);bp.type='bandpass';bp.frequency.value=low?900:2600;bp.Q.value=.8;
 ng.gain.setValueAtTime(.35*vol,t);ng.gain.exponentialRampToValueAtTime(.001,t+(/^(Na|Ta|Ti|Tu|Ke|Ka)$/.test(bol)?.05:.03));ns.connect(bp);bp.connect(ng);ng.connect(SWM);ns.start(t);ns.stop(t+.09)}

function swPanel(w){const ids={s:'sws',r:'swr'};Object.keys(ids).forEach(k=>{const el=document.getElementById(ids[k]),on=w===k&&el&&!el.classList.contains('on');if(el)el.classList.toggle('on',on);const b=document.querySelector('.glass[data-p="'+k+'"]');if(b)b.classList.toggle('on',on)})}
function swSetScale(r,m){SW.root=r;SW.minor=m;swAll();Object.keys(SWP).forEach(k=>delete SWP[k]);const o=$('#swa');if(o)o.outerHTML=swKeys();
 {const pn=$('#sws');if(pn)pn.classList.toggle('m1',m)}
 document.querySelectorAll('#sws .swc').forEach(b=>b.classList.toggle('on',+b.dataset.r===r&&(b.dataset.m==='1')===m));
 swLbl();tdStart()}
function swVol(){if(SWM)SWM.gain.value=swGain();const m=$('#swmu');if(m)m.textContent=SW.mute?'🔇':'🔊'}
document.addEventListener('click',e=>{const t=e.target;if(!t.closest)return;
 const pb=t.closest('.glass[data-p]');if(pb){swPanel(pb.dataset.p);return}
 if(t.closest('.swx')){swPanel(null);return}
 if(t.closest('#swtd')){TD.run?tdStop():tdStart();return}
 const tb=t.closest('.swtab');if(tb){$('#sws').classList.toggle('m1',tb.dataset.tab==='1');return}
 const sc=t.closest('#sws .swc');if(sc){swSetScale(+sc.dataset.r,sc.dataset.m==='1');return}
 const tl=t.closest('[data-tl]');if(tl){TL.name=tl.dataset.tl;TL.beat=0;TL.q=[];if(TL.run)TL.next=SWAC.currentTime+.1;document.querySelectorAll('#swr [data-tl]').forEach(b=>b.classList.toggle('on',b===tl));$('#swdots').innerHTML=swDots();swLbl();return}
 const bp=t.closest('[data-bp]');if(bp){tlSetBpm(TL.bpm+ +bp.dataset.bp);return}
 if(t.closest('#swplay')){TL.run?tlStop():tlStart();return}
 if(t.closest('#swtap')){const n=performance.now();if(TL.taps.length&&n-TL.taps[TL.taps.length-1]>2000)TL.taps=[];TL.taps.push(n);TL.taps=TL.taps.slice(-5);if(TL.taps.length>1){const d=(TL.taps[TL.taps.length-1]-TL.taps[0])/(TL.taps.length-1);tlSetBpm(60000/d)}return}
 if(t.closest('#swmu')){SW.mute=!SW.mute;swVol();return}
 if(!t.closest('.swpan,.swk,.swvol'))swPanel(null)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='swvol'){SW.vol=+t.value;SW.mute=false;swVol()}else if(t.id==='swbpm')tlSetBpm(+t.value)});

function initJoin(){
 $('#rf').onsubmit=async e=>{e.preventDefault();
  const bad=(id,c,m)=>{$(id).nextElementSibling.textContent=c?'':m;return !c};
  const n=$('#fn').value.trim(),ph=$('#ph').value.trim(),ins=$('#ins').value,voc=$('#voc').value,pw=$('#pw').value,fe=$('#fe');fe.textContent='';
  let x=false;
  x=bad('#fn',n.length>=3,'Enter your full name.')|x;
  x=bad('#ph',/^[6-9]\d{9}$/.test(ph),'Enter a valid 10-digit Indian mobile number.')|x;
  x=bad('#voc',!!(ins||voc),'Please select an instrument or vocal.')|x;
  x=bad('#pw',pw.length>=8,'Password must be at least 8 characters.')|x;
  if(x)return;
  const b=$('#sb2');b.disabled=true;b.textContent='Submitting...';
  try{
   let uid,r=await sb.auth.signUp({email:mail(ph),password:pw});
   if(r.error&&/registered|exists/i.test(r.error.message)){
    const l=await pwLogin(ph,pw);
    if(l.error)throw new Error('This mobile number is already registered. Please use Member Login.');
    uid=l.data.user.id;const ex=await Q(sb.from('students').select('id').eq('user_id',uid).maybeSingle());
    if(ex)throw new Error('This mobile number is already registered. Please use Member Login.');
   }else if(r.error)throw r.error;
   else{if(!r.data.session)throw new Error('Registration is not fully set up yet. Please contact the academy.');uid=r.data.user.id}
   await Q(sb.from('students').insert({user_id:uid,full_name:n,whatsapp:ph,instrument:ins||null,vocal:voc||null,class_format:$('#cf').value,track:$('#tr').value}));
   $('#ok').classList.add('on');b.classList.add('hide');
   await sb.auth.signOut();
  }catch(err){fe.textContent=/instrument|vocal|dob/i.test(err.message||'')?'Registration is being updated. Please contact the academy.':(err.message||'Something went wrong. Please try again.');b.disabled=false;b.textContent='Submit registration'}
 }}

  if(a=='rv-del'){if(!confirm('Delete this review?'))return;await Q(sb.from('reviews').delete().eq('id',id));showA('Reviews');return}
  if(a=='del-a'){if(!confirm('Delete this event?'))return;await Q(sb.from('announcements').delete().eq('id',id));showA('Upcoming Events');return}
  if(a=='gdel'){if(!confirm('Delete this photo?'))return;await sb.storage.from('site-images').remove([b.dataset.path]);await Q(sb.from('gallery').delete().eq('id',id));showA('Gallery');return}
 }catch(x){b.disabled=false;toast('Failed: '+(x.message||x))}}

// Admin area opens only after a fresh login on the Admin Login page (flag lives only in this tab)
function admFlag(v){try{if(v===undefined)return sessionStorage.getItem('adm_ok')==='1';if(v)sessionStorage.setItem('adm_ok','1');else sessionStorage.removeItem('adm_ok')}catch(e){return v===undefined?false:undefined}}
// ===== Router =====
let RT=0;
async function render(){
 const t=++RT,h=location.hash.slice(1)||'home';
 $('#links').classList.remove('on');const ad=$('#adm');if(ad)ad.remove();document.body.classList.toggle('admin-on',h=='admin'||h=='admin-login');$('#pub').classList.toggle('hide',h=='admin'||h=='admin-login');
 if(h=='admin-login'){$('#pub').insertAdjacentHTML('afterend','<div id="adm">'+alogin()+'</div>');scrollTo(0,0);initAlogin();return}
 if(!sb&&h=='admin'){location.hash='#admin-login';return}
 if(!sb){$('#pv').innerHTML='<section><div class="card nt"><b>The site could not load its services.</b><p class="sub">Please check your internet connection and refresh.</p></div></section>';return}
 if(h!='admin'&&h!='admin-login')admFlag(0);
 if(h=='admin'){const ok=admFlag();if(!ok||await myRole()!=='admin'){if(!ok){try{await sb.auth.signOut()}catch(e){}}if(t===RT)location.hash='#admin-login';return}if(t!==RT)return;await loadCfg();if(t!==RT)return;$('#pub').insertAdjacentHTML('afterend','<div id="adm">'+adminShell()+'</div>');scrollTo(0,0);showA(curA);return}
 if(h!='admin'){const L=await isMember();if(t!==RT)return;LOG=L;setNav(L);/* site gate paused for now */}
 const v={join,portal}[h];
 $('#pv').innerHTML=v?v():home();scrollTo(0,0);
 document.querySelectorAll('.links a').forEach(a=>a.classList.toggle('cur',a.getAttribute('href')=='#'+h));
 if(!v){document.querySelectorAll('.pframe img').forEach(g=>g.onclick=()=>{$('#lb').innerHTML='<img src="'+g.getAttribute('src')+'" alt="" style="max-height:92vh;max-width:94vw;border-radius:12px">';$('#lb').classList.add('on')});const ok=['home','about','courses','gallery','reviews','contact'].includes(h)?h:'home';document.querySelectorAll('#pv>section').forEach(x=>x.classList.toggle('hide',x.id!==ok));
  if(ok=='gallery')loadGallery();if(ok=='reviews')loadReviews();if(ok=='contact')fillContact();if(ok=='home')loadTicker();else $('#tick').classList.add('hide');if(h=='home'||!h)[0,150,600].forEach(ms=>setTimeout(()=>{if(location.hash.slice(1)=='home'||!location.hash)scrollTo(0,0)},ms))}
 else{$('#tick').classList.add('hide');if(h=='join')initJoin();else if(h=='portal')initPortal()}}

document.addEventListener('click',e=>{
 const bg=e.target.closest('[data-burger]');if(bg){const l=bg.closest('nav').querySelector('.links');if(l)l.classList.toggle('on');return}
 if(e.target.closest('[data-lo]')){admFlag(0);if(sb)sb.auth.signOut();return}
 if(!$('#adm'))return;
 const a=e.target.closest('[data-a]');if(a){showA(a.dataset.a);return}
 const b=e.target.closest('[data-act]');if(b)adminAct(b)});
document.addEventListener('change',e=>{if(e.target.id=='am'){if(e.target.value=='__lo'){admFlag(0);if(sb)sb.auth.signOut();location.hash='#home'}else showA(e.target.value)}});
const T=e=>e.target.closest?e.target:document.body;
document.addEventListener('mousemove',e=>{if(matchMedia('(pointer:coarse)').matches)return;const c=T(e).closest('.card,.gal img');if(c&&!c.matches('.tw,form,#lg,.nt')){const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(800px) rotateY(${x*14}deg) rotateX(${-y*14}deg) translateZ(8px)`}const st=T(e).closest('.stage'),sc=$('#sc');if(st&&sc&&T(e).closest('.swk,.swpan,.swvol')){sc.style.transform='';return}if(st&&sc){const r=st.getBoundingClientRect();sc.style.transform=`rotateY(${((e.clientX-r.left)/r.width-.5)*34}deg) rotateX(${-((e.clientY-r.top)/r.height-.5)*34}deg)`}});
document.addEventListener('mouseout',e=>{const c=T(e).closest('.card,.gal img');if(c&&!c.contains(e.relatedTarget))c.style.transform='';const st=T(e).closest('.stage'),sc=$('#sc');if(st&&sc&&!st.contains(e.relatedTarget))sc.style.transform=''});

$('#burger').onclick=()=>$('#links').classList.toggle('on');
addEventListener('hashchange',render);
if(sb)loadHits();
// A fresh visit (typed link, new tab, back button) always needs a new admin login; only a page refresh keeps you in
try{const nv=performance.getEntriesByType('navigation')[0];if(!nv||nv.type!=='reload')admFlag(0)}catch(e){admFlag(0)}
(async()=>{if(sb)await loadCfg();render()})();
</script></body></html>
